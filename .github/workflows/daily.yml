# The schedule (SPEC §17.4): runs the drain with --tick twice a day.
name: daily
on:
  schedule:
    - cron: "15 13 * * 1-5"  # 18:45 IST on weekdays, after the bhavcopy is out
    - cron: "30 2 * * *"     # 08:00 IST catch-up
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keepalive:
    # GitHub disables scheduled workflows after 60 days without repo activity (§17.4 keep-alive).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keep this schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow enable daily.yml || true
  drain:
    needs: keepalive
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/drain.yml
    with:
      reason: schedule
      tick: true
    secrets: inherit
