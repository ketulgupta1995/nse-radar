# The cloud worker (SPEC §17.3, §17.4): runs every queued job, then exits.
# Started by hand, by Vercel (dispatch.kick) or by daily.yml. Output is counts only (§17.8).
name: drain
run-name: drain (${{ inputs.reason || 'manual' }})
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this drain runs (shown in the run name)
        type: string
        default: manual
      tick:
        description: Enqueue every due schedule first
        type: boolean
        default: false
      hop:
        description: How many drains in a row this one continues (stops at 3)
        type: number
        default: 0
  workflow_call:
    inputs:
      reason:
        type: string
        default: manual
      tick:
        type: boolean
        default: false
      hop:
        type: number
        default: 0
concurrency:
  group: drain
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 340  # the drain's own budget is 300 min (app/jobs/drain.py); GitHub's cap is 360
    permissions:
      contents: read
      actions: write  # start a follow-up drain when jobs are left over
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e backend
      - run: mkdir -p data/cache
      - name: Restore the replica and price store
        uses: actions/cache/restore@v4
        with:
          path: |
            data/replica.db*
            data/cache/price_store.pkl
          key: replica-${{ github.run_id }}
          restore-keys: replica-
      - name: Drain the job queue
        id: drain
        working-directory: backend
        env:
          STOCK_RUNTIME: actions
          STOCK_DATA_DIR: ${{ github.workspace }}/data
          STOCK_REPLICA_PATH: ${{ github.workspace }}/data/replica.db
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          DRAIN_TICK: ${{ inputs.tick && '--tick' || '' }}
        run: python -m app.jobs.drain --lane all $DRAIN_TICK
      - name: Save the replica and price store
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/replica.db*
            data/cache/price_store.pkl
          key: replica-${{ github.run_id }}
      # The budget ran out with jobs still queued: start another drain. It runs after the cache save
      # above, so the next drain restores this run's replica. At most 3 in a row.
      - name: Continue in a new drain
        if: steps.drain.outputs.more == 'true' && inputs.hop < 3
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HOP: ${{ inputs.hop }}
        run: |
          next=$((HOP + 1))
          gh workflow run drain.yml --ref main -f reason="continue $next" -f hop="$next"
      # Weekly backup (SPEC §17.8): the plain .db.gz never leaves the runner; only the .enc is uploaded.
      - name: Encrypt the backup
        id: backup
        if: always()
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          shopt -s nullglob
          files=(data/backups/*.db.gz)
          if [ ${#files[@]} -eq 0 ]; then echo "no backup this run"; exit 0; fi
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::BACKUP_PASSPHRASE secret is missing; deleting the unencrypted backup"
            rm -f "${files[@]}"
            exit 1
          fi
          for f in "${files[@]}"; do
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:BACKUP_PASSPHRASE -in "$f" -out "$f.enc"
            rm -f "$f"
            echo "name=$(basename "$f").enc" >> "$GITHUB_OUTPUT"
          done
      - name: Upload the encrypted backup
        if: always() && steps.backup.outputs.name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.backup.outputs.name }}
          path: data/backups/*.db.gz.enc
          retention-days: 90
          if-no-files-found: error
